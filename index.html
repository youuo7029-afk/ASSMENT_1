<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment - اختبار التقييم العقاري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="text-slate-800 p-3 md:p-6 flex flex-col items-center justify-start min-h-screen">
    <main class="w-full max-w-3xl mt-10">
        <!-- WELCOME SCREEN -->
        <div id="welcome-screen" class="glass-card rounded-2xl p-6 md:p-8 shadow-2xl text-center space-y-6">
            <h1 class="text-3xl font-extrabold text-indigo-950">Assessment</h1>
            <p class="text-slate-600 text-sm">اختبار معلومات المشروعات العقارية والمساحات والأسعار (25 سؤال)</p>
            <div class="space-y-4 text-right">
                <label class="block text-sm font-bold text-slate-700">اسم الطالب بالكامل:</label>
                <input type="text" id="student-name" placeholder="أدخل اسمك..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 font-medium">
            </div>
            <button onclick="startExam()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg text-lg">ابدأ الامتحان الآن</button>
        </div>

        <!-- EXAM SCREEN -->
        <div id="exam-screen" class="hidden glass-card rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
            <div class="flex justify-between border-b pb-4">
                <span id="display-student-name" class="font-bold text-slate-800"></span>
                <span id="progress-text" class="text-xs font-bold text-indigo-600"></span>
            </div>
            <h2 id="question-title" class="text-lg md:text-xl font-bold text-slate-900"></h2>
            <textarea id="answer-input" rows="4" placeholder="اكتب الإجابة هنا..." class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500"></textarea>
            <p id="error-msg" class="hidden text-xs text-rose-600 font-bold">يجب كتابة إجابة قبل الانتقال للسؤال التالي!</p>
            <div class="flex justify-between">
                <button id="prev-btn" onclick="prevQuestion()" class="hidden bg-slate-200 px-4 py-2 rounded-xl font-bold">السابق</button>
                <button id="next-btn" onclick="nextQuestion()" class="mr-auto bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">التالي</button>
                <button id="submit-btn" onclick="submitExam()" class="hidden mr-auto bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold">تسليم الامتحان</button>
            </div>
        </div>

        <!-- COMPLETED SCREEN -->
        <div id="completed-screen" class="hidden glass-card rounded-2xl p-8 shadow-2xl text-center space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">تم تسليم الامتحان بنجاح!</h2>
            <p class="text-slate-600 text-sm">قم بانسخ تقرير الإجابات وأرسله للمسؤول:</p>
            <textarea id="result-summary" readonly rows="6" class="w-full p-3 bg-slate-50 border rounded-lg text-xs font-mono"></textarea>
            <button onclick="copyResults()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">نسخ التقرير</button>
        </div>
    </main>

    <script>
        const projects = ["Hydepark", "Sodic", "Makadi", "Gouna", "Scenes"];
        const questionsList = [];
        projects.forEach(project => {
            questionsList.push({ project, title: `ما هي مساحة الـ 1 Bedroom والـ Start Price؟ (${project})` });
            questionsList.push({ project, title: `ما هي مساحة الـ 2 Bedrooms والـ Start Price؟ (${project})` });
            questionsList.push({ project, title: `ما هي مساحة الـ 3 Bedrooms والـ Start Price؟ (${project})` });
            questionsList.push({ project, title: `ما هي خطة الدفع والسداد (Payment Plan)؟ (${project})` });
            questionsList.push({ project, title: `ما هي تفاصيل الصيانة (Maintenance)؟ (${project})` });
        });

        let currentQuestionIndex = 0;
        let studentAnswers = {};
        let studentName = "";

        function startExam() {
            studentName = document.getElementById('student-name').value.trim();
            if (!studentName) { alert("أدخل اسمك من فضلك."); return; }
            document.getElementById('display-student-name').innerText = studentName;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            loadQuestion(0);
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('question-title').innerText = questionsList[index].title;
            document.getElementById('progress-text').innerText = `سؤال ${index + 1} من 25`;
            document.getElementById('answer-input').value = studentAnswers[index] || "";
            document.getElementById('prev-btn').classList.toggle('hidden', index === 0);
            document.getElementById('next-btn').classList.toggle('hidden', index === questionsList.length - 1);
            document.getElementById('submit-btn').classList.toggle('hidden', index !== questionsList.length - 1);
        }

        function nextQuestion() {
            const val = document.getElementById('answer-input').value.trim();
            if (!val) { document.getElementById('error-msg').classList.remove('hidden'); return; }
            studentAnswers[currentQuestionIndex] = val;
            loadQuestion(currentQuestionIndex + 1);
        }

        function prevQuestion() {
            studentAnswers[currentQuestionIndex] = document.getElementById('answer-input').value.trim();
            loadQuestion(currentQuestionIndex - 1);
        }

        function submitExam() {
            const val = document.getElementById('answer-input').value.trim();
            if (!val) { document.getElementById('error-msg').classList.remove('hidden'); return; }
            studentAnswers[currentQuestionIndex] = val;

            let report = `تقرير امتحان Assessment\nالاسم: ${studentName}\n------------------\n`;
            questionsList.forEach((q, idx) => {
                report += `س${idx + 1}: ${q.title}\nإجابة: ${studentAnswers[idx]}\n\n`;
            });

            document.getElementById('result-summary').value = report;
            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('completed-screen').classList.remove('hidden');
        }

        function copyResults() {
            const textarea = document.getElementById('result-summary');
            textarea.select();
            document.execCommand('copy');
            alert('تم نسخ التقریر بنجاح!');
        }
    </script>
</body>
</html>
